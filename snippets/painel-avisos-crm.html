<!-- ==========================================================================
     Painel de avisos do CRM — cole este bloco inteiro antes de </body>
     no HTML do CRM. Não depende de biblioteca nenhuma.

     Do outro lado, o Worker precisa da rota /api/avisos
     (ver snippets/painel-avisos-worker.js).

     Ajuste as três primeiras linhas do <script> se o seu CRM guardar o token
     com outro nome ou apontar para outro endereço.
     ========================================================================== -->

<style>
  /* Tudo com prefixo crmav- para não esbarrar no CSS que o CRM já tem. */
  #crmav-raiz {
    --crmav-acento: #128c7e;        /* verde WhatsApp; troque pela cor do CRM */
    --crmav-fundo: #ffffff;
    --crmav-fundo-2: #f6f7f9;
    --crmav-borda: #e3e6ea;
    --crmav-texto: #1c1f23;
    --crmav-texto-fraco: #6b7280;
    --crmav-alerta: #e11d48;
    position: fixed; inset: 0; pointer-events: none; z-index: 2147483000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #crmav-raiz * { box-sizing: border-box; }

  /* --- botão flutuante --- */
  #crmav-botao {
    pointer-events: auto;
    position: absolute; right: 20px; bottom: 20px;
    width: 56px; height: 56px; border-radius: 50%;
    border: none; cursor: pointer;
    background: var(--crmav-acento); color: #fff; font-size: 24px; line-height: 1;
    box-shadow: 0 6px 20px rgba(0,0,0,.22);
    transition: transform .15s ease;
  }
  #crmav-botao:hover { transform: scale(1.06); }
  #crmav-botao.crmav-escondido { opacity: 0; pointer-events: none; transform: scale(.8); }
  #crmav-botao:active { transform: scale(.97); }
  #crmav-badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 11px; background: var(--crmav-alerta); color: #fff;
    font-size: 12px; font-weight: 700; line-height: 22px; text-align: center;
    box-shadow: 0 0 0 2px #fff;
  }
  #crmav-badge[hidden] { display: none; }

  /* --- painel --- */
  #crmav-painel {
    pointer-events: auto;
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 380px; max-width: 100vw;
    background: var(--crmav-fundo); color: var(--crmav-texto);
    border-left: 1px solid var(--crmav-borda);
    box-shadow: -8px 0 30px rgba(0,0,0,.12);
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .22s ease;
  }
  #crmav-painel.crmav-aberto { transform: translateX(0); }

  #crmav-cabecalho {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px; border-bottom: 1px solid var(--crmav-borda);
  }
  #crmav-cabecalho h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
  .crmav-icone-botao {
    border: none; background: transparent; cursor: pointer; padding: 6px;
    border-radius: 6px; color: var(--crmav-texto-fraco); font-size: 16px; line-height: 1;
  }
  .crmav-icone-botao:hover { background: var(--crmav-fundo-2); color: var(--crmav-texto); }

  #crmav-lista { flex: 1; overflow-y: auto; padding: 8px 0; }

  .crmav-item {
    display: flex; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--crmav-fundo-2);
    text-decoration: none; color: inherit;
  }
  .crmav-item:hover { background: var(--crmav-fundo-2); }
  .crmav-item.crmav-novo { background: #f0fdf9; }
  .crmav-item.crmav-novo:hover { background: #e6faf4; }

  .crmav-avatar {
    flex: 0 0 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; font-size: 17px; background: var(--crmav-fundo-2);
  }
  .crmav-corpo { min-width: 0; flex: 1; }
  .crmav-titulo {
    font-size: 14px; font-weight: 600; margin: 0 0 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .crmav-detalhe {
    font-size: 13px; color: var(--crmav-texto-fraco); margin: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .crmav-quando { font-size: 11px; color: var(--crmav-texto-fraco); margin-top: 4px; }

  #crmav-vazio, #crmav-erro {
    padding: 40px 24px; text-align: center; color: var(--crmav-texto-fraco); font-size: 14px;
  }
  #crmav-erro { color: #b45309; }

  #crmav-rodape {
    padding: 10px 18px; border-top: 1px solid var(--crmav-borda);
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--crmav-texto-fraco);
  }
  #crmav-rodape button {
    border: 1px solid var(--crmav-borda); background: var(--crmav-fundo);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
    color: var(--crmav-texto);
  }
  #crmav-rodape button:hover { background: var(--crmav-fundo-2); }
  #crmav-status { margin-left: auto; }

  @media (max-width: 480px) {
    #crmav-painel { width: 100vw; border-left: none; }
  }
</style>

<div id="crmav-raiz" aria-live="polite">
  <button id="crmav-botao" type="button" aria-label="Abrir avisos do CRM">
    🔔<span id="crmav-badge" hidden>0</span>
  </button>

  <aside id="crmav-painel" role="dialog" aria-label="Avisos do CRM">
    <div id="crmav-cabecalho">
      <h2>Avisos</h2>
      <button class="crmav-icone-botao" id="crmav-som" type="button" title="Ligar/desligar som">🔊</button>
      <button class="crmav-icone-botao" id="crmav-fechar" type="button" aria-label="Fechar">✕</button>
    </div>

    <div id="crmav-lista">
      <div id="crmav-vazio">Nada novo por aqui.</div>
    </div>

    <div id="crmav-rodape">
      <button id="crmav-permissao" type="button" hidden>Avisar na tela do computador</button>
      <span id="crmav-status">—</span>
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  // ---- Configuração -------------------------------------------------------
  var API = 'https://crm-thiago-leads-worker.bento-nunes22.workers.dev';
  var CHAVES_TOKEN = ['token', 'jwt', 'crmToken', 'authToken', 'crm_token'];  // onde o CRM guarda o login
  var INTERVALO_MS = 45000;   // de quanto em quanto tempo pergunta ao servidor
  var JANELA_H = 24;          // quanto tempo para trás o painel mostra

  // ---- Estado -------------------------------------------------------------
  var avisos = [];                 // lista mesclada, mais recente primeiro
  var vistoEm = localStorage.getItem('crmav_visto_em') || '1970-01-01T00:00:00Z';
  var somLigado = localStorage.getItem('crmav_som') !== 'off';
  var aberto = false;
  var timer = null;

  var el = {
    botao: document.getElementById('crmav-botao'),
    badge: document.getElementById('crmav-badge'),
    painel: document.getElementById('crmav-painel'),
    lista: document.getElementById('crmav-lista'),
    fechar: document.getElementById('crmav-fechar'),
    som: document.getElementById('crmav-som'),
    permissao: document.getElementById('crmav-permissao'),
    status: document.getElementById('crmav-status'),
  };

  // ---- Token do CRM -------------------------------------------------------
  function pegarToken() {
    for (var i = 0; i < CHAVES_TOKEN.length; i++) {
      var v = localStorage.getItem(CHAVES_TOKEN[i]);
      if (v && v.length > 20) return v.replace(/^"|"$/g, '');
    }
    return null;
  }

  // ---- Busca --------------------------------------------------------------
  function buscar() {
    var token = pegarToken();
    if (!token) { mostrarStatus('faça login no CRM'); return Promise.resolve(); }

    var desde = new Date(Date.now() - JANELA_H * 3600000).toISOString();

    return fetch(API + '/api/avisos?desde=' + encodeURIComponent(desde), {
      headers: { Authorization: 'Bearer ' + token },
    })
      .then(function (r) {
        if (r.status === 401) throw new Error('sessão expirada');
        if (!r.ok) throw new Error('servidor ' + r.status);
        return r.json();
      })
      .then(function (dados) {
        if (!dados || !dados.sucesso) throw new Error('resposta inesperada');
        mesclar(dados.avisos || []);
        mostrarStatus('atualizado ' + horaCurta(new Date()));
      })
      .catch(function (erro) {
        mostrarStatus(erro.message);
      });
  }

  /** Junta o que chegou com o que já estava, sem repetir, e avisa se houver novidade. */
  function mesclar(chegaram) {
    var conhecidos = {};
    avisos.forEach(function (a) { conhecidos[a.id] = true; });

    var novos = chegaram.filter(function (a) { return !conhecidos[a.id]; });
    if (novos.length) {
      avisos = chegaram.concat(avisos.filter(function (a) {
        return !chegaram.some(function (c) { return c.id === a.id; });
      }));
      avisos.sort(function (a, b) { return a.quando < b.quando ? 1 : -1; });
    }

    var naoVistos = novos.filter(function (a) { return a.quando > vistoEm; });
    if (naoVistos.length && !aberto) {
      tocar();
      notificar(naoVistos[0]);
    }
    desenhar();
  }

  // ---- Desenho ------------------------------------------------------------
  var ICONES = { lead: '🔔', lembrete: '⏰', agenda: '📅' };

  function desenhar() {
    // Com o painel aberto o badge não faz sentido, mas o destaque verde continua:
    // é ele que mostra o que chegou desde a última vez que o Thiago olhou.
    var novos = aberto ? 0 : avisos.filter(function (a) { return a.quando > vistoEm; }).length;
    el.badge.textContent = novos > 99 ? '99+' : String(novos);
    el.badge.hidden = novos === 0;
    el.botao.setAttribute('aria-label', novos ? novos + ' avisos novos' : 'Abrir avisos do CRM');

    if (!avisos.length) {
      el.lista.innerHTML = '<div id="crmav-vazio">Nada novo por aqui.</div>';
      return;
    }

    el.lista.innerHTML = '';
    avisos.forEach(function (a) {
      var item = document.createElement(a.link ? 'a' : 'div');
      item.className = 'crmav-item' + (a.quando > vistoEm ? ' crmav-novo' : '');
      if (a.link) { item.href = a.link; item.target = '_blank'; item.rel = 'noopener'; }

      var avatar = document.createElement('div');
      avatar.className = 'crmav-avatar';
      avatar.textContent = ICONES[a.tipo] || '•';

      var corpo = document.createElement('div');
      corpo.className = 'crmav-corpo';

      var titulo = document.createElement('p');
      titulo.className = 'crmav-titulo';
      titulo.textContent = a.titulo;                 // textContent: nome de lead não vira HTML

      var detalhe = document.createElement('p');
      detalhe.className = 'crmav-detalhe';
      detalhe.textContent = a.detalhe || '';

      var quando = document.createElement('div');
      quando.className = 'crmav-quando';
      quando.textContent = tempoRelativo(a.quando) + (a.link ? ' · abrir conversa' : '');

      corpo.appendChild(titulo);
      if (a.detalhe) corpo.appendChild(detalhe);
      corpo.appendChild(quando);
      item.appendChild(avatar);
      item.appendChild(corpo);
      el.lista.appendChild(item);
    });
  }

  function mostrarStatus(texto) { el.status.textContent = texto; }

  // ---- Tempo --------------------------------------------------------------
  function horaCurta(d) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function tempoRelativo(iso) {
    var d = new Date(iso);
    var min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 1) return 'agora';
    if (min < 60) return 'há ' + min + ' min';
    var h = Math.round(min / 60);
    if (h < 24 && d.getDate() === new Date().getDate()) return 'há ' + h + 'h';
    if (h < 48) return 'ontem ' + horaCurta(d);
    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') +
           ' ' + horaCurta(d);
  }

  // ---- Som e notificação do sistema ---------------------------------------
  function tocar() {
    if (!somLigado) return;
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var vol = ctx.createGain();
      osc.frequency.value = 880;
      vol.gain.setValueAtTime(0.0001, ctx.currentTime);
      vol.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
      vol.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
      osc.connect(vol); vol.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.36);
      setTimeout(function () { ctx.close(); }, 600);
    } catch (e) { /* navegador sem áudio liberado: silêncio, sem quebrar nada */ }
  }

  function notificar(aviso) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      var n = new Notification(aviso.titulo, { body: aviso.detalhe || '', tag: aviso.id });
      n.onclick = function () { window.focus(); abrir(); n.close(); };
    } catch (e) { /* alguns navegadores exigem service worker; sem drama */ }
  }

  // ---- Abrir/fechar -------------------------------------------------------
  function marcarVisto() {
    vistoEm = new Date().toISOString();
    localStorage.setItem('crmav_visto_em', vistoEm);
  }

  function abrir() {
    aberto = true;
    el.painel.classList.add('crmav-aberto');
    el.botao.classList.add('crmav-escondido');
    desenhar();
  }

  function fechar() {
    aberto = false;
    el.painel.classList.remove('crmav-aberto');
    el.botao.classList.remove('crmav-escondido');
    marcarVisto();     // só agora: enquanto lia, o destaque verde ficou de pé
    desenhar();
  }

  el.botao.addEventListener('click', function () { aberto ? fechar() : abrir(); });
  el.fechar.addEventListener('click', fechar);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && aberto) fechar(); });

  el.som.addEventListener('click', function () {
    somLigado = !somLigado;
    localStorage.setItem('crmav_som', somLigado ? 'on' : 'off');
    el.som.textContent = somLigado ? '🔊' : '🔇';
    el.som.title = somLigado ? 'Som ligado' : 'Som desligado';
    if (somLigado) tocar();
  });
  el.som.textContent = somLigado ? '🔊' : '🔇';

  if ('Notification' in window && Notification.permission === 'default') {
    el.permissao.hidden = false;
    el.permissao.addEventListener('click', function () {
      Notification.requestPermission().then(function () { el.permissao.hidden = true; });
    });
  }

  // ---- Ciclo --------------------------------------------------------------
  function ligarTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () { if (!document.hidden) buscar(); }, INTERVALO_MS);
  }

  // Aba escondida não consulta; ao voltar, atualiza na hora.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) buscar(); });

  buscar();
  ligarTimer();
})();
</script>
